name: Build TokoNote macOS

on:
  push:
    branches: [main, agent/tokonote-macos-web-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    env:
      TOKONOTE_VERSION: '1.0.0'
      MAC_SIGN: ${{ secrets.MAC_SIGN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Prepare pinned Cue source
        shell: bash
        run: |
          set -euo pipefail
          CUE_COMMIT="0d7b22302b5bc6c4eb5548f5a9eb285eedafdd18"
          curl -fL "https://github.com/Blueturboguy07/cue/archive/${CUE_COMMIT}.zip" -o /tmp/cue.zip
          unzip -q /tmp/cue.zip -d /tmp
          mv "/tmp/cue-${CUE_COMMIT}" source
          cp scripts/white-label-tokonote.js source/white-label-tokonote.js
          cd source
          node white-label-tokonote.js
          rm white-label-tokonote.js

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Run upstream tests
        working-directory: source
        run: npm test

      - name: Build Apple Silicon macOS
        working-directory: source
        run: npx electron-builder --config electron-builder.cjs --mac dmg zip --arm64

      - name: Collect Apple Silicon
        shell: bash
        run: |
          mkdir -p release
          cp source/dist/*.dmg source/dist/*.zip release/

      - name: Build Intel macOS
        working-directory: source
        shell: bash
        run: |
          rm -rf dist
          npx electron-builder --config electron-builder.cjs --mac dmg zip --x64

      - name: Collect customer package and source
        shell: bash
        run: |
          set -euo pipefail
          cp source/dist/*.dmg source/dist/*.zip release/
          cp source/LICENSE source/TOKONOTE-LICENSE-NOTICE.md release/
          cat > release/CARA-INSTALL-TOKONOTE.txt <<'EOF'
          TOKONOTE macOS - TOKOFILE
          =========================

          1. Pilih file sesuai Mac Anda:
             - arm64 = Apple Silicon (M1/M2/M3/M4 dan seterusnya)
             - x64   = Mac Intel
          2. Double-click file .dmg.
          3. Drag TokoNote ke folder Applications.
          4. Buka Applications > TokoNote.
          5. Saat diminta, izinkan Mikrofon dan Perekaman Layar/Audio di
             System Settings > Privacy & Security.
          6. Buka Pengaturan TokoNote, masukkan API key OpenAI / Gemini /
             Anthropic / Deepgram yang ingin digunakan, lalu klik Mulai.

          Untuk pengalaman customer benar-benar sekali klik tanpa peringatan
          Gatekeeper, build harus ditandatangani Developer ID dan dinotarize Apple.
          Workflow ini otomatis melakukan signing/notarization jika secret Apple
          yang dibutuhkan tersedia di repository.
          EOF
          cd source
          zip -qr "../release/TokoNote-${TOKONOTE_VERSION}-source-GPL.zip" . \
            -x 'node_modules/*' 'dist/*' '.git/*'

      - name: Upload ready-to-deliver package
        uses: actions/upload-artifact@v4
        with:
          name: TokoNote-macOS-READY
          path: release/*
          if-no-files-found: error
          retention-days: 30
